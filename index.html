<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ichigo: A Child of the Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23132a52%22/%3E%3Ccircle cx=%228%22 cy=%229%22 r=%224%22 fill=%22%23b8322a%22/%3E%3C/svg%3E">
</head>
<body>
<!-- A mid-90s PC monitor, right up close: its casing fills the window, and the game plays on its
     screen. The monitor is drawn smoothly in CSS; only the game inside the screen (and the mouse
     pointer) is pixel art. -->
<div class="pc">
  <div class="monitor">
    <div class="bezel">
      <div class="screen"><div class="picture"><canvas id="c"></canvas></div><div class="afterglow"></div><div class="glass"></div></div>
    </div>
    <div class="chin">
      <span class="badge">SVGA&nbsp;14&quot;</span>
      <span class="vents"></span>
      <span class="controls"><i class="knob"></i><i class="knob"></i><button class="power" type="button" title="Power" aria-label="Power" aria-pressed="true"><i class="led"></i></button></span>
    </div>
  </div>
  <!-- (switched off: the monitor's stand, and the keyboard in front of it, tipped back in 3D, its keys
       added by src/pc.js. The matching code there and in css/style.css is switched off too.)
  <div class="neck"></div>
  <div class="foot"></div>
  <div class="desk">
    <div class="plane"><div class="keyboard"></div></div>
  </div>
  -->
</div>
<!-- (switched off: what was on the page around the PC, the full-screen button and the footer. F and
     the settings still go full screen; see src/pc.js.)
<button id="fullscreen" type="button" title="Play full screen (F)">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg>
  Full screen
</button>
<footer id="footer">Built from scratch by me · © 2026 Nadia Shovkovy</footer>
-->
<div id="touch">
  <div class="grp"><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div>
  <div class="grp"><div class="tb" data-k="use">●</div><div class="tb" data-k="run">≋</div><div class="tb" data-k="jump">▲</div></div>
</div>
<!-- All the game code lives in src/. main.js is the starting point. -->
<script type="module" src="src/main.js"></script>
</body>
</html>
